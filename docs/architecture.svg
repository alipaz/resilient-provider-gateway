<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Zohal gateway architecture</title>
  <desc id="desc">Request flow from client through the FastAPI gateway to three external providers, with Redis controls, Prometheus metrics, and asynchronous audit persistence through RabbitMQ and Celery to PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .heading { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .node { stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1320" height="720" rx="20" fill="#f8fafc"/>
  <text x="48" y="55" class="title">Zohal Gateway Architecture</text>
  <text x="48" y="82" class="subtitle">Synchronous provider routing with asynchronous, durable audit persistence</text>

  <!-- Client -->
  <rect x="48" y="230" width="155" height="88" rx="14" fill="#ffffff" stroke="#94a3b8" class="node"/>
  <text x="125.5" y="266" text-anchor="middle" class="heading">Client</text>
  <text x="125.5" y="292" text-anchor="middle" class="small">POST /v1/process</text>

  <!-- Gateway boundary -->
  <rect x="275" y="120" width="410" height="355" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="154" class="heading">FastAPI Gateway</text>
  <text x="300" y="178" class="small">Async request path • bounded work • controlled errors</text>

  <rect x="310" y="205" width="340" height="52" rx="10" fill="#ffffff" stroke="#93c5fd" class="node"/>
  <text x="480" y="226" text-anchor="middle" class="label">Correlation middleware</text>
  <text x="480" y="246" text-anchor="middle" class="small">Request ID • Trace ID • structured logs</text>

  <rect x="310" y="280" width="340" height="52" rx="10" fill="#ffffff" stroke="#93c5fd" class="node"/>
  <text x="480" y="301" text-anchor="middle" class="label">Global admission control</text>
  <text x="480" y="321" text-anchor="middle" class="small">Bounded backpressure</text>

  <rect x="310" y="355" width="340" height="82" rx="10" fill="#ffffff" stroke="#93c5fd" class="node"/>
  <text x="480" y="379" text-anchor="middle" class="label">Reliability-first weighted routing</text>
  <text x="480" y="401" text-anchor="middle" class="small">EWMA latency/error • circuit breaker • semaphore</text>
  <text x="480" y="421" text-anchor="middle" class="small">bounded retry • retry budget • HTTPX limits/timeouts</text>

  <path d="M 203 274 L 275 274" class="edge-blue"/>
  <text x="239" y="258" text-anchor="middle" class="small">JSON + IDs</text>

  <!-- External providers -->
  <text x="840" y="132" text-anchor="middle" class="heading">External providers</text>
  <rect x="750" y="160" width="180" height="62" rx="12" fill="#ecfdf5" stroke="#34d399" class="node"/>
  <text x="840" y="187" text-anchor="middle" class="label">Provider A</text>
  <text x="840" y="208" text-anchor="middle" class="small">:8001/v1/process</text>
  <rect x="750" y="242" width="180" height="62" rx="12" fill="#ecfdf5" stroke="#34d399" class="node"/>
  <text x="840" y="269" text-anchor="middle" class="label">Provider B</text>
  <text x="840" y="290" text-anchor="middle" class="small">:8002/v1/process</text>
  <rect x="750" y="324" width="180" height="62" rx="12" fill="#ecfdf5" stroke="#34d399" class="node"/>
  <text x="840" y="351" text-anchor="middle" class="label">Provider C</text>
  <text x="840" y="372" text-anchor="middle" class="small">:8003/v1/process</text>

  <path d="M 650 396 C 705 396, 700 191, 750 191" class="edge-blue"/>
  <path d="M 650 396 C 705 396, 700 273, 750 273" class="edge-blue"/>
  <path d="M 650 396 C 705 396, 700 355, 750 355" class="edge-blue"/>

  <!-- Shared controls and observability -->
  <rect x="1020" y="165" width="220" height="92" rx="14" fill="#fff7ed" stroke="#fb923c" class="node"/>
  <text x="1130" y="194" text-anchor="middle" class="heading">Redis</text>
  <text x="1130" y="218" text-anchor="middle" class="small">Provider token buckets</text>
  <text x="1130" y="238" text-anchor="middle" class="small">Retry budget</text>
  <path d="M 685 440 L 980 440 L 980 211 L 1020 211" class="edge-dashed"/>

  <rect x="1020" y="305" width="220" height="92" rx="14" fill="#faf5ff" stroke="#a78bfa" class="node"/>
  <text x="1130" y="334" text-anchor="middle" class="heading">Prometheus</text>
  <text x="1130" y="358" text-anchor="middle" class="small">/metrics</text>
  <text x="1130" y="378" text-anchor="middle" class="small">RPS • latency • errors • circuits</text>
  <path d="M 685 450 C 830 450, 855 351, 1020 351" class="edge-dashed"/>

  <!-- Async persistence path -->
  <text x="48" y="545" class="heading">Asynchronous audit path</text>
  <text x="48" y="568" class="small">The client response is not blocked by PostgreSQL writes</text>

  <rect x="275" y="600" width="210" height="72" rx="14" fill="#fffbeb" stroke="#fbbf24" class="node"/>
  <text x="380" y="629" text-anchor="middle" class="heading">RabbitMQ</text>
  <text x="380" y="653" text-anchor="middle" class="small">Durable bounded audit queue</text>

  <rect x="555" y="600" width="210" height="72" rx="14" fill="#fff1f2" stroke="#fb7185" class="node"/>
  <text x="660" y="629" text-anchor="middle" class="heading">Celery worker</text>
  <text x="660" y="653" text-anchor="middle" class="small">Retry + idempotent upsert</text>

  <rect x="835" y="600" width="210" height="72" rx="14" fill="#f0fdfa" stroke="#2dd4bf" class="node"/>
  <text x="940" y="629" text-anchor="middle" class="heading">PostgreSQL</text>
  <text x="940" y="653" text-anchor="middle" class="small">Requests + provider attempts</text>

  <path d="M 480 475 L 480 525 L 380 525 L 380 600" class="edge"/>
  <text x="422" y="515" text-anchor="middle" class="small">audit event</text>
  <path d="M 485 636 L 555 636" class="edge"/>
  <path d="M 765 636 L 835 636" class="edge"/>

  <rect x="1085" y="604" width="155" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1162.5" y="628" text-anchor="middle" class="label">Docker Compose</text>
  <text x="1162.5" y="649" text-anchor="middle" class="small">One-command runtime</text>
</svg>
